# Paired measurements use one runner, one harness and one saved fixture set.
# Never deploy these benchmark application builds.
name: Historical editor benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/historical-editor-benchmarks.yml'
      - 'scripts/plan-editor-pairs.mjs'
      - 'tests/benchmarks/EditorPairPlan.test.mjs'
      - 'src/Orbit.UI/Components/Canvas/GraphWorkspace.razor.cs'
      - 'src/Orbit.Presentation/Canvas/NodeExpansionState.cs'
  workflow_dispatch:
    inputs:
      before_revision:
        description: Exact baseline commit SHA (blank for historical mode)
        type: string
        default: ''
      after_revision:
        description: Exact candidate commit SHA (blank for historical mode)
        type: string
        default: ''
      workload:
        description: Expansion matrix or standard editor operations (composite uses navigation)
        type: choice
        options: [expansion, standard]
        default: expansion
      repeats:
        description: Repeats per window (1–5)
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '3'
      playback:
        description: Include playback workloads
        type: boolean
        default: true
      profile:
        description: Editor fixture
        type: choice
        options: [editor-50, editor-200, editor-500, editor-composite-100]
        default: editor-50
      viewport:
        description: Desktop or narrow viewport emulation
        type: choice
        options: [desktop, mobile]
        default: desktop

permissions:
  contents: read

jobs:
  historical-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PAIR_BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.before_revision || '' }}
      PAIR_AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.after_revision || '' }}
      PAIR_SMOKE: 'false'
      WORKLOAD: ${{ inputs.workload || 'expansion' }}
      ORBIT_EDITOR_REPEATS: ${{ inputs.repeats || '3' }}
      ORBIT_EDITOR_IDLE_MS: '1500'
      ORBIT_EDITOR_VIEWPORT: ${{ inputs.viewport || 'desktop' }}
      ORBIT_EDITOR_PLAYBACK: ${{ github.event_name == 'pull_request' && '1' || (inputs.playback && '1' || '0') }}
      ORBIT_EDITOR_RENDER_COUNTS: '0'
      PROFILE: ${{ inputs.profile || 'editor-50' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate benchmark plan and exact revisions
        run: |
          set -euo pipefail
          node --test tests/benchmarks/*.test.mjs
          reports="$RUNNER_TEMP/historical-editor"
          node scripts/plan-editor-pairs.mjs "$reports"
          while IFS= read -r rev; do
            test "$(git cat-file -t "$rev")" = commit
            test "$(git rev-parse "$rev^{commit}")" = "$rev"
          done < "$reports/revisions.txt"
          if [[ "$(cat "$reports/mode.txt")" == historical ]]; then
            mapfile -t revs < "$reports/revisions.txt"
            middle_parent=c7d3a32b6d6cd2796fa667b0317a39a1688ec906
            git merge-base --is-ancestor "${revs[0]}" "${revs[1]}"
            git merge-base --is-ancestor "${revs[1]}" "$middle_parent"
            git merge-base --is-ancestor "$middle_parent" "${revs[2]}"
            git diff --exit-code "${revs[1]}" "$middle_parent" -- . ':!docs/**/*.md' ':!AGENTS.md' ':!.github/copilot-instructions.md'
          fi
          case "$PROFILE" in editor-50|editor-200|editor-500|editor-composite-100) ;; *) exit 1;; esac
          case "$WORKLOAD" in expansion|standard) ;; *) exit 1;; esac
          case "$ORBIT_EDITOR_REPEATS" in 1|2|3|4|5) ;; *) exit 1;; esac
          case "$ORBIT_EDITOR_VIEWPORT" in desktop|mobile) ;; *) exit 1;; esac
      - name: Prepare dependencies and one saved fixture set
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/historical-browser" --no-audit --no-fund --ignore-scripts --no-save playwright-core@1.65.1
          npm install --prefix "$RUNNER_TEMP/historical-faust" --no-audit --no-fund --ignore-scripts --no-save @grame/faustwasm@0.19.0
          mkdir -p "$RUNNER_TEMP/historical-editor"
          dotnet run --project tests/Orbit.Audio.Probe/Orbit.Audio.Probe.csproj --configuration Release -- --editor-benchmark "$RUNNER_TEMP/historical-editor/fixtures"
          git rev-parse HEAD > "$RUNNER_TEMP/historical-editor/harness-revision.txt"
      - name: Publish selected exact runtimes
        run: |
          set -euo pipefail
          mapfile -t revisions < "$RUNNER_TEMP/historical-editor/revisions.txt"
          for rev in "${revisions[@]}"; do
            checkout="$RUNNER_TEMP/historical-src-$rev"
            output="$RUNNER_TEMP/historical-publish-$rev"
            git worktree add --detach "$checkout" "$rev"
            (
              cd "$checkout"
              test "$(git rev-parse HEAD)" = "$rev"
              node src/Orbit.UI/DesignSystem/generate-tokens.mjs
              npm exec --yes --package=@grame/faustwasm@0.19.0 -- faust2wasm-ts src/Orbit.Audio/Dsp/Oscillators/ModulatedSine.dsp src/Orbit.Infrastructure/wwwroot/audio/generated/modulated-sine
              node scripts/prepare-faust-compiler.mjs "$RUNNER_TEMP/historical-faust/node_modules/@grame/faustwasm"
              dotnet publish src/Orbit.UI/Orbit.UI.csproj --configuration Release --output "$output" -p:OrbitBrowserAssetVersion="$rev" -p:OrbitBuildNumber="$GITHUB_RUN_NUMBER"
              node scripts/version-published-editor.mjs "$output/wwwroot" "$rev" "$GITHUB_RUN_NUMBER"
              cd "$output/wwwroot/_content/Orbit.Infrastructure"
              cp -a audio "audio-$rev"
              cp -a persistence "persistence-$rev"
              test -s "audio-$rev/generated/compiler/index.js"
            )
            git worktree remove --force "$checkout"
          done
      - name: Measure selected revisions sequentially and compare
        run: |
          set -euo pipefail
          export ORBIT_PLAYWRIGHT_DIR="$RUNNER_TEMP/historical-browser/node_modules/playwright-core"
          export ORBIT_CHROME="$(command -v google-chrome || command -v chromium)"
          test -x "$ORBIT_CHROME"
          reports="$RUNNER_TEMP/historical-editor"
          export ORBIT_EDITOR_EXPANSION_MATRIX=0
          if [[ "$PROFILE" != editor-composite-100 && "$WORKLOAD" == expansion ]]; then
            export ORBIT_EDITOR_EXPANSION_MATRIX=1
          fi
          mapfile -t revisions < "$reports/revisions.txt"
          for rev in "${revisions[@]}"; do
            ORBIT_REVISION="$rev" ORBIT_BENCH_PUBLISH_DIR="$RUNNER_TEMP/historical-publish-$rev/wwwroot" \
              node scripts/benchmark-live.mjs --editor "$reports/fixtures" "$reports/$rev.json" "$PROFILE"
          done
          while IFS=$'\t' read -r label before after; do
            node scripts/compare-editor-benchmarks.mjs "$reports/$before.json" "$reports/$after.json" "$reports/$label.json"
          done < "$reports/pairs.tsv"
          node --input-type=module - "$reports" <<'JS' > "$reports/summary.md"
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const dir = process.argv[2];
          const display = n => Number.isFinite(n) ? n.toFixed(2) : "N/A";
          const pair = m => display(m.before) + " → " + display(m.after);
          console.log("# Paired editor performance (same-runner diagnostic)");
          const plan = JSON.parse(readFileSync(join(dir, "plan.json"), "utf8"));
          for (const pairPlan of plan.pairs) {
            const r = JSON.parse(readFileSync(join(dir, pairPlan.label + ".json"), "utf8"));
            console.log("\n## " + pairPlan.label);
            console.log("\nBuilt revisions: " + r.beforeRevision + " → " + r.afterRevision);
            console.log("\nProfile: " + Object.keys(r.fixtures).join(", ") + "; viewport: " + r.settings.mode + "; repeats: " + r.settings.repeats);
            console.log("\n| State | Expansion | Workload | FPS before → after | P95 ms before → after | DOM before → after |");
            console.log("| --- | --- | --- | ---: | ---: | ---: |");
            for (const row of r.rows) {
              const c = row.changes;
              console.log("| " + [row.state, row.expansion?.name ?? "default", row.workload, pair(c.fps), pair(c.frameGapP95Ms), pair(c.domElements)].join(" | ") + " |");
            }
          }
          console.log("\nShared runner, sequential build order, muted output, no physical-device or audio-underrun measurement. See JSON for all metrics, fingerprints and provenance.");
          JS
          cat "$reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$reports/summary.md"
      - name: Preserve paired reports and fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-historical-editor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/historical-editor/
          retention-days: 90
          if-no-files-found: warn
