# CI tests the graph model and builds the Blazor UI with its referenced libraries, then
# publishes the generated static browser assets to GitHub Pages on main.
name: Build and deploy

# Pull requests build only; main pushes and manual runs can deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The graph tests need neither a browser nor generated Faust assets.
      - name: Test signal graph and domain
        run: dotnet test tests/Orbit.Domain.Tests/Orbit.Domain.Tests.csproj --configuration Release
      # Node is a build-time tool only: Faust produces browser-ready WASM assets.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile Faust DSP
        run: npm exec --yes --package=@grame/faustwasm@0.19.0 -- faust2wasm-ts src/Orbit.Audio/Dsp/Oscillators/Sine.dsp src/Orbit.Infrastructure/wwwroot/audio/generated/sine
      # Assert the real DSP and its supporting runtime were generated.
      - name: Verify Faust build assets
        run: |
          test -s src/Orbit.Infrastructure/wwwroot/audio/generated/sine/dsp-module.wasm
          test -s src/Orbit.Infrastructure/wwwroot/audio/generated/sine/dsp-meta.json
          test -s src/Orbit.Infrastructure/wwwroot/audio/generated/sine/faustwasm/index.js
      - name: Test audio infrastructure components
        run: node --test tests/audio/*.test.mjs
      # Compiles the referenced projects and produces the static site in publish/wwwroot.
      - name: Build and publish
        run: dotnet publish src/Orbit.UI/Orbit.UI.csproj --configuration Release --output publish
      # Ensure the class library's browser assets actually made it to the static site.
      - name: Verify published audio assets
        run: |
          test -s publish/wwwroot/_content/Orbit.Infrastructure/audio/audio.js
          test -s publish/wwwroot/_content/Orbit.Infrastructure/audio/AudioEngine.js
          test -s publish/wwwroot/_content/Orbit.Infrastructure/audio/generated/sine/dsp-module.wasm
      # The browser entry document must resolve runtime files under /orbit2/.
      - name: Set GitHub Pages base path
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: sed -i 's|<base href="/" />|<base href="/orbit2/" />|' publish/wwwroot/index.html
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  # Deploy consumes the build artifact, not the C# source files.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
