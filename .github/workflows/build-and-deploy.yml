# CI tests the graph model and builds the Blazor UI with its referenced libraries, then
# publishes the generated static browser assets to GitHub Pages on main.
name: Build and deploy

# Always report the build check. Documentation-only changes run lightweight checks;
# runtime changes build fully. Only main runtime builds/manual runs can deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test CI change classification
        run: node --test tests/tooling/CiChangeScope.test.mjs
      - name: Classify changed files
        id: changes
        run: node scripts/ci-change-scope.mjs build
      - name: Check documentation links
        run: node scripts/check-doc-links.mjs
      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.runtime == 'true'
        with:
          dotnet-version: '10.0.x'
      # The graph tests need neither a browser nor generated Faust assets.
      - name: Test signal graph and domain
        if: steps.changes.outputs.runtime == 'true'
        run: dotnet test tests/Orbit.Domain.Tests/Orbit.Domain.Tests.csproj --configuration Release
      - name: Test canvas presentation state
        if: steps.changes.outputs.runtime == 'true'
        run: dotnet test tests/Orbit.Presentation.Tests/Orbit.Presentation.Tests.csproj --configuration Release
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.runtime == 'true'
        with:
          python-version: '3.11'
      - name: Test offline Agent Kit and native import
        if: steps.changes.outputs.runtime == 'true'
        run: |
          export ORBIT_AGENT_KIT_DATA="$RUNNER_TEMP/orbit-agent-kit"
          export PYTHONPATH="$GITHUB_WORKSPACE/tools/agent-kit"
          exporter=tools/agent-kit/exporter/Orbit.AgentKit.Exporter.csproj
          dotnet run --project "$exporter" -c Release -- --patch-contract "$ORBIT_AGENT_KIT_DATA"
          dotnet run --project "$exporter" -c Release -- "$ORBIT_AGENT_KIT_DATA/catalog.json"
          dotnet run --project "$exporter" -c Release -- --connection-rules "$ORBIT_AGENT_KIT_DATA/connection-rules.json"
          python -m unittest discover -s tools/agent-kit/tests -p 'test_*.py' -v
          python tools/agent-kit/tests/generate_native_fixture.py "$ORBIT_AGENT_KIT_DATA" "$ORBIT_AGENT_KIT_DATA/python-patch.json" "$ORBIT_AGENT_KIT_DATA/python-edited.json" "$ORBIT_AGENT_KIT_DATA/python-structural.json" "$ORBIT_AGENT_KIT_DATA/python-sequence.json"
          dotnet run --project "$exporter" -c Release -- --validate-patch "$ORBIT_AGENT_KIT_DATA/python-patch.json"
          dotnet run --project "$exporter" -c Release -- --validate-patch "$ORBIT_AGENT_KIT_DATA/python-edited.json"
          dotnet run --project "$exporter" -c Release -- --validate-patch "$ORBIT_AGENT_KIT_DATA/python-structural.json"
          dotnet run --project "$exporter" -c Release -- --validate-patch "$ORBIT_AGENT_KIT_DATA/python-sequence.json"
      # Rebuild the tracked stylesheet and reject stale output or invalid tokens.
      - name: Generate and test design tokens
        if: steps.changes.outputs.runtime == 'true'
        run: |
          node src/Orbit.UI/DesignSystem/generate-tokens.mjs
          git diff --exit-code -- src/Orbit.UI/wwwroot/css/tokens.css
          node --test tests/ui/*.test.mjs
      - name: Compile Faust DSP
        if: steps.changes.outputs.runtime == 'true'
        run: |
          npm exec --yes --package=@grame/faustwasm@0.19.0 -- faust2wasm-ts src/Orbit.Audio/Dsp/Oscillators/ModulatedSine.dsp src/Orbit.Infrastructure/wwwroot/audio/generated/modulated-sine
      # The browser's lazy worker uses the same pinned Faust distribution.
      - name: Prepare browser graph compiler
        if: steps.changes.outputs.runtime == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/orbit-faust" --no-audit --no-fund --ignore-scripts --no-save @grame/faustwasm@0.19.0
          node scripts/prepare-faust-compiler.mjs "$RUNNER_TEMP/orbit-faust/node_modules/@grame/faustwasm"
      # Assert the real DSP and its supporting runtime were generated.
      - name: Verify Faust build assets
        if: steps.changes.outputs.runtime == 'true'
        run: |
          test -s src/Orbit.Infrastructure/wwwroot/audio/generated/modulated-sine/dsp-module.wasm
          test -s src/Orbit.Infrastructure/wwwroot/audio/generated/modulated-sine/dsp-meta.json
          test -s src/Orbit.Infrastructure/wwwroot/audio/generated/modulated-sine/faustwasm/index.js
          test -s src/Orbit.Infrastructure/wwwroot/audio/generated/compiler/index.js
      - name: Test audio infrastructure and compiled DSP
        if: steps.changes.outputs.runtime == 'true'
        run: node --test tests/audio/*.test.mjs
      # Exercise the real graph compiler output, not a handcrafted DSP fixture.
      - name: Compile and render generated graph
        if: steps.changes.outputs.runtime == 'true'
        env:
          ORBIT_GRAPH_PROBE_DIR: ${{ runner.temp }}/orbit-graph-probe
          ORBIT_FAUST_DIR: ${{ runner.temp }}/orbit-faust/node_modules/@grame/faustwasm
        run: |
          dotnet run --project tests/Orbit.Audio.Probe/Orbit.Audio.Probe.csproj --configuration Release -- "$ORBIT_GRAPH_PROBE_DIR"
          npm exec --yes --package=@grame/faustwasm@0.19.0 -- faust2wasm-ts "$ORBIT_GRAPH_PROBE_DIR/program.dsp" "$ORBIT_GRAPH_PROBE_DIR/compiled"
          node --test tests/compiler/*.test.mjs
      - name: Upload static macro audio reference
        if: steps.changes.outputs.runtime == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: static-macro-audio-reference
          path: |
            ${{ runner.temp }}/orbit-graph-probe/static-macro-baseline.json
            ${{ runner.temp }}/orbit-graph-probe/static-macro-report.json
          if-no-files-found: error
      # Timings are informational; deterministic output and graph contracts are the gates.
      - name: Benchmark offline DSP baseline
        if: steps.changes.outputs.runtime == 'true'
        timeout-minutes: 5
        env:
          ORBIT_FAUST_DIR: ${{ runner.temp }}/orbit-faust/node_modules/@grame/faustwasm
          ORBIT_BENCH_SECONDS: '1'
        run: |
          node --test tests/benchmarks/*.test.mjs
          dotnet run --project tests/Orbit.Audio.Probe/Orbit.Audio.Probe.csproj --configuration Release -- --benchmark "$RUNNER_TEMP/orbit-benchmark"
          node scripts/benchmark-dsp.mjs "$RUNNER_TEMP/orbit-benchmark" "$RUNNER_TEMP/orbit-benchmark/offline-report.json"
      # Check the bundled worker and actual browser AudioWorklet together.
      - name: Browser graph playback smoke test
        if: steps.changes.outputs.runtime == 'true'
        timeout-minutes: 5
        env:
          ORBIT_GRAPH_PROBE_DIR: ${{ runner.temp }}/orbit-graph-probe
          ORBIT_PLAYWRIGHT_DIR: ${{ runner.temp }}/orbit-browser/node_modules/playwright-core
        run: |
          npm install --prefix "$RUNNER_TEMP/orbit-browser" --no-audit --no-fund --ignore-scripts --no-save playwright-core@1.65.1
          export ORBIT_CHROME="$(command -v google-chrome || command -v chromium)"
          test -x "$ORBIT_CHROME"
          node tests/browser/GraphPlaybackSmoke.mjs
      # Compiles the referenced projects and produces the static site in publish/wwwroot.
      - name: Build and publish
        if: steps.changes.outputs.runtime == 'true'
        run: dotnet publish src/Orbit.UI/Orbit.UI.csproj --configuration Release --output publish -p:OrbitBrowserAssetVersion="$GITHUB_SHA" -p:OrbitBuildNumber="$GITHUB_RUN_NUMBER"
      # Ensure the generated token CSS and every imported stylesheet are published.
      - name: Verify published design system
        if: steps.changes.outputs.runtime == 'true'
        run: |
          test -s publish/wwwroot/css/tokens.css
          cmp src/Orbit.UI/wwwroot/css/tokens.css publish/wwwroot/css/tokens.css
          test -s publish/wwwroot/css/base.css
          test -s publish/wwwroot/css/components.css
          test -s publish/wwwroot/js/canvasDom.js
          test -s publish/wwwroot/js/performanceKeyboard.js
          test -s publish/wwwroot/js/editorPerformance.js
          for file in src/Orbit.UI/wwwroot/css/components/*.css; do
            test -s "publish/wwwroot/css/components/$(basename "$file")"
          done
      # Ensure the class library's browser assets actually made it to the static site.
      - name: Verify published audio assets
        if: steps.changes.outputs.runtime == 'true'
        run: |
          test -s publish/wwwroot/_content/Orbit.Infrastructure/audio/audio.js
          test -s publish/wwwroot/_content/Orbit.Infrastructure/audio/AudioEngine.js
          test -s publish/wwwroot/_content/Orbit.Infrastructure/audio/Faust/FaustCompilerWorker.js
          test -s publish/wwwroot/_content/Orbit.Infrastructure/audio/generated/compiler/index.js
          test -s publish/wwwroot/_content/Orbit.Infrastructure/audio/generated/modulated-sine/dsp-module.wasm
          test -s publish/wwwroot/_content/Orbit.Infrastructure/audio/generated/modulated-sine/dsp-meta.json
          test -s publish/wwwroot/_content/Orbit.Infrastructure/audio/generated/modulated-sine/faustwasm/index.js
      # Namespace the entire module tree, including worker and generated assets,
      # so new .NET code can never import JavaScript cached from an older commit.
      - name: Version published browser module trees
        if: steps.changes.outputs.runtime == 'true'
        run: |
          node scripts/version-published-editor.mjs publish/wwwroot "$GITHUB_SHA" "$GITHUB_RUN_NUMBER"
          cd publish/wwwroot/_content/Orbit.Infrastructure
          cp -a audio "audio-$GITHUB_SHA"
          cp -a persistence "persistence-$GITHUB_SHA"
          test -s "persistence-$GITHUB_SHA/patchStorage.js"
          test -s "audio-$GITHUB_SHA/audio.js"
          test -s "audio-$GITHUB_SHA/Faust/FaustCompilerWorker.js"
          test -s "audio-$GITHUB_SHA/generated/compiler/index.js"
      - name: Test published editor playback
        if: steps.changes.outputs.runtime == 'true'
        timeout-minutes: 5
        env:
          ORBIT_PLAYWRIGHT_DIR: ${{ runner.temp }}/orbit-browser/node_modules/playwright-core
        run: |
          export ORBIT_CHROME="$(command -v google-chrome || command -v chromium)"
          node tests/browser/PublishedPlaybackSmoke.mjs
      - name: Benchmark published editor (external renderer)
        if: steps.changes.outputs.runtime == 'true'
        timeout-minutes: 5
        env:
          ORBIT_PLAYWRIGHT_DIR: ${{ runner.temp }}/orbit-browser/node_modules/playwright-core
          ORBIT_BENCH_LIVE_SECONDS: '5'
        run: |
          export ORBIT_CHROME="$(command -v google-chrome || command -v chromium)"
          node scripts/benchmark-live.mjs "$RUNNER_TEMP/orbit-benchmark" "$RUNNER_TEMP/orbit-benchmark/live-report.json"
      - name: Benchmark large-patch editor smoke
        if: steps.changes.outputs.runtime == 'true'
        timeout-minutes: 15
        env:
          ORBIT_PLAYWRIGHT_DIR: ${{ runner.temp }}/orbit-browser/node_modules/playwright-core
          ORBIT_EDITOR_REPEATS: '1'
          ORBIT_EDITOR_IDLE_MS: '500'
        run: |
          export ORBIT_CHROME="$(command -v google-chrome || command -v chromium)"
          dotnet run --project tests/Orbit.Audio.Probe/Orbit.Audio.Probe.csproj --configuration Release -- --editor-benchmark "$RUNNER_TEMP/orbit-editor-benchmark"
          node scripts/benchmark-live.mjs --editor "$RUNNER_TEMP/orbit-editor-benchmark" "$RUNNER_TEMP/orbit-editor-benchmark/editor-report.json" editor-50 editor-200
          ORBIT_EDITOR_PLAYBACK=0 node scripts/benchmark-live.mjs --editor "$RUNNER_TEMP/orbit-editor-benchmark" "$RUNNER_TEMP/orbit-editor-benchmark/editor-500-stopped.json" editor-500
          ORBIT_EDITOR_VIEWPORT=mobile ORBIT_EDITOR_PLAYBACK=0 node scripts/benchmark-live.mjs --editor "$RUNNER_TEMP/orbit-editor-benchmark" "$RUNNER_TEMP/orbit-editor-benchmark/editor-mobile-stopped.json" editor-200
          ORBIT_EDITOR_RENDER_COUNTS=1 node scripts/benchmark-live.mjs --editor "$RUNNER_TEMP/orbit-editor-benchmark" "$RUNNER_TEMP/orbit-editor-benchmark/editor-render-counts.json" editor-50
      - name: Benchmark expansion-state matrix
        if: steps.changes.outputs.runtime == 'true'
        timeout-minutes: 10
        env:
          ORBIT_PLAYWRIGHT_DIR: ${{ runner.temp }}/orbit-browser/node_modules/playwright-core
          ORBIT_EDITOR_REPEATS: '1'
          ORBIT_EDITOR_IDLE_MS: '500'
          ORBIT_EDITOR_EXPANSION_MATRIX: '1'
        run: |
          export ORBIT_CHROME="$(command -v google-chrome || command -v chromium)"
          node scripts/benchmark-live.mjs --editor "$RUNNER_TEMP/orbit-editor-benchmark" "$RUNNER_TEMP/orbit-editor-benchmark/editor-expansion-matrix.json" editor-50
      - name: Benchmark composite canvas navigation
        if: steps.changes.outputs.runtime == 'true'
        timeout-minutes: 10
        env:
          ORBIT_PLAYWRIGHT_DIR: ${{ runner.temp }}/orbit-browser/node_modules/playwright-core
          ORBIT_EDITOR_REPEATS: '1'
          ORBIT_EDITOR_IDLE_MS: '500'
          ORBIT_EDITOR_COMPOSITE_RESOURCES: '1'
        run: |
          export ORBIT_CHROME="$(command -v google-chrome || command -v chromium)"
          node scripts/benchmark-live.mjs --editor "$RUNNER_TEMP/orbit-editor-benchmark" "$RUNNER_TEMP/orbit-editor-benchmark/editor-composite-100.json" editor-composite-100
      - name: Benchmark composite canvas telemetry (diagnostics only)
        if: steps.changes.outputs.runtime == 'true'
        timeout-minutes: 5
        env:
          ORBIT_PLAYWRIGHT_DIR: ${{ runner.temp }}/orbit-browser/node_modules/playwright-core
          ORBIT_EDITOR_REPEATS: '1'
          ORBIT_EDITOR_IDLE_MS: '1000'
          ORBIT_EDITOR_COMPOSITE_TELEMETRY: '1'
          ORBIT_EDITOR_ASSERT_QUIET_ROOT: '1'
        run: |
          export ORBIT_CHROME="$(command -v google-chrome || command -v chromium)"
          node scripts/benchmark-live.mjs --editor "$RUNNER_TEMP/orbit-editor-benchmark" "$RUNNER_TEMP/orbit-editor-benchmark/editor-composite-telemetry.json" editor-composite-100
      - name: Verify folded visualization lifecycle
        if: steps.changes.outputs.runtime == 'true'
        timeout-minutes: 5
        env:
          ORBIT_PLAYWRIGHT_DIR: ${{ runner.temp }}/orbit-browser/node_modules/playwright-core
          ORBIT_EDITOR_REPEATS: '1'
          ORBIT_EDITOR_IDLE_MS: '1000'
          ORBIT_EDITOR_FOLD_RESOURCES: '1'
          ORBIT_EDITOR_ASSERT_FOLDED_DEMAND: '1'
        run: |
          export ORBIT_CHROME="$(command -v google-chrome || command -v chromium)"
          node scripts/benchmark-live.mjs --editor "$RUNNER_TEMP/orbit-editor-benchmark" "$RUNNER_TEMP/orbit-editor-benchmark/editor-folded-resources.json" editor-50
      - name: Upload editor benchmark baseline
        if: steps.changes.outputs.runtime == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-editor-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/orbit-editor-benchmark/
          retention-days: 30
      - name: Upload DSP benchmark baseline
        if: steps.changes.outputs.runtime == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-dsp-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/orbit-benchmark/
          retention-days: 30
      # The browser entry document must resolve runtime files under /orbit2/.
      - name: Set GitHub Pages base path
        if: steps.changes.outputs.runtime == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: sed -i 's|<base href="/" />|<base href="/orbit2/" />|' publish/wwwroot/index.html
      - name: Upload Pages artifact
        if: steps.changes.outputs.runtime == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  # Deploy consumes the build artifact, not the C# source files.
  deploy:
    if: needs.build.outputs.runtime == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Check after acquiring the Pages lock. Documentation-only changes
      # do not invalidate an already built runtime artifact.
      - name: Check current main runtime inputs
        id: current-main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          latest="$(git rev-parse refs/remotes/origin/main)"
          node scripts/ci-change-scope.mjs deploy "$GITHUB_SHA" "$latest"
      - uses: actions/configure-pages@v5
        if: steps.current-main.outputs.deploy == 'true'
      - name: Deploy to GitHub Pages
        if: steps.current-main.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
